<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio - Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 50px 60px;
      max-width: 600px;
      width: 100%;
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .welcome-icon {
      font-size: 64px;
      margin-bottom: 20px;
      animation: wave 1s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(20deg); }
      75% { transform: rotate(-20deg); }
    }

    h2 {
      color: #333;
      font-size: 32px;
      margin-bottom: 15px;
    }

    .username {
      color: #667eea;
      font-weight: bold;
    }

    p {
      color: #666;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .success-message {
      background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
      padding: 20px;
      border-radius: 10px;
      margin: 20px 0;
      text-align: center;
      color: #1a5f3f;
      font-weight: 500;
    }

    .btn-logout {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: block;
      width: 100%;
      margin-top: 20px;
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-logout:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
    }

    .btn-logout:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="welcome-icon">👋</div>
      <h2>¡Bienvenido, <span class="username">{{ user }}</span>!</h2>
    </div>
    
    <div class="success-message">
      ✓ Has iniciado sesión correctamente
    </div>
    
    <p style="text-align: center;">
      Acceso concedido al sistema. Disfruta de tu sesión.
    </p>
    
    <button class="btn-logout" onclick="window.location.href='/'">
      Cerrar Sesión
    </button>
  </div>
</body>
</html>
